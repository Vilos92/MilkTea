name: Install bun and dependencies
description: Install bun followed by the project dependencies
runs:
  using: composite
  steps:
    # No checkout here: every job checks out first, since `./.github/actions/…` cannot resolve
    # otherwise. A second checkout would reset the job's own fetch depth, which the `fallow` job
    # needs at full depth to find a merge base.
    - uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-
    - uses: oven-sh/setup-bun@v2
    - run: bun install --frozen-lockfile
      shell: bash
