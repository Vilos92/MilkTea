# Runs fmt, lint, typecheck, and Playwright-backed tests on every push to
# main and every pull request. On pull requests, also runs a fallow audit
# diffing against the merge base.
#
# greg-zone/bun-git is oven/bun plus git, built locally on the CI host from
# greg-zone/ci/bun-git/Dockerfile. If every step fails pulling the image,
# rebuild it there.
when:
  - event: pull_request
  - event: push
    branch: main

clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      # fallow diffs against a merge base, which a partial clone lacks.
      partial: false

steps:
  - name: install
    image: greg-zone/bun-git:1.3.14
    commands:
      - bun install --frozen-lockfile

  - name: fmt
    image: greg-zone/bun-git:1.3.14
    depends_on: [install]
    commands:
      - bun run fmt:check

  - name: lint
    image: greg-zone/bun-git:1.3.14
    depends_on: [install]
    commands:
      - bun run lint

  - name: typecheck
    image: greg-zone/bun-git:1.3.14
    depends_on: [install]
    commands:
      - bun run typecheck

  - name: test
    image: greg-zone/bun-git:1.3.14
    depends_on: [install]
    commands:
      - bunx playwright install --with-deps chromium chromium-headless-shell
      - bun run test

  - name: fallow
    image: greg-zone/bun-git:1.3.14
    depends_on: [install]
    when:
      - event: pull_request
    commands:
      - bun run fallow:audit -- --base 'HEAD^1'
