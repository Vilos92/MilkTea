[package]
name = "milktea"
version = "0.3.0"
description = "Visual music in a lightweight desktop app"
authors = ["Greg Linscheid"]
license = "MIT"
repository = "https://github.com/Vilos92/MilkTea"
edition = "2021"
rust-version = "1.77.2"

# The library target keeps the application entry reusable for mobile targets.

[lib]
name = "milktea_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
cpal = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.3", features = [] }

# The native PipeWire and PulseAudio hosts only exist on Linux, so the features stay scoped here
# and the macOS build keeps its default CoreAudio host untouched.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["pipewire", "pulseaudio"] }
