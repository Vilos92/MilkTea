[package]
name = "milktea"
version = "0.2.1"
description = "Visual music in a lightweight desktop app"
authors = ["Greg Linscheid"]
license = "MIT"
repository = "https://github.com/Vilos92/MilkTea"
edition = "2021"
rust-version = "1.77.2"

# The library target keeps the application entry reusable for mobile targets.

[lib]
name = "milktea_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
cpal = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.3", features = [] }
