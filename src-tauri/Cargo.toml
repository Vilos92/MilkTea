[package]
name = "milktea"
version = "0.0.0"
description = "Visual music in a lightweight desktop app"
authors = ["Greg Linscheid"]
repository = "https://github.com/Vilos92/MilkTea"
edition = "2021"
rust-version = "1.77.2"

# The library target keeps the application entry reusable for mobile targets.

[lib]
name = "milktea_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
