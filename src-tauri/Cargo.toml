[package]
name = "milktea"
version = "0.4.0"
description = "Visual music in a lightweight desktop app"
authors = ["Greg Linscheid"]
license = "MIT"
repository = "https://github.com/Vilos92/MilkTea"
edition = "2021"
rust-version = "1.77.2"

# The library target keeps the application entry reusable for mobile targets.

[lib]
name = "milktea_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
cpal = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The `devtools` feature keeps the webview inspector available in release builds, so a user can
# open it with F12 or the right-click menu and read console logs when reporting an issue. Release
# builds otherwise ship no devtools affordance at all. On macOS this relies on private WebKit APIs,
# which is fine for this app's non-App-Store distribution.
tauri = { version = "2.11.3", features = ["devtools"] }

# The native PulseAudio host only exists on Linux, so the feature stays scoped here and the macOS
# build keeps its default CoreAudio host untouched. It is a pure-Rust protocol client, so it needs
# no system headers and adds no runtime linkage, and it reaches PipeWire through pipewire-pulse.
# cpal's `pipewire` feature is deliberately off: its libspa bindings do not compile against the
# PipeWire 0.3.48 headers in the Ubuntu 22.04 release image.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["pulseaudio"] }
