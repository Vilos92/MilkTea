# Builds both macOS architectures on the trusted Mac mini Local-backend agent.
# Bundles are ad-hoc signed. They are not Apple-notarized.
labels:
  platform: darwin/arm64
  backend: local
  release: milktea

depends_on:
  - release-create

when:
  - event: tag
    ref: refs/tags/v*

clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      lfs: false
      partial: false

steps:
  - name: validate
    image: bash
    environment:
      GITHUB_TOKEN:
        from_secret: github_release_token
    commands:
      - bun run release:verify-tag

  - name: install
    image: bash
    depends_on: [validate]
    commands:
      - bun install --frozen-lockfile
      - rustup target add aarch64-apple-darwin x86_64-apple-darwin

  - name: build-macos
    image: bash
    depends_on: [install]
    commands:
      - bun run build:desktop -- --target aarch64-apple-darwin --bundles dmg
      - bun run build:desktop -- --target x86_64-apple-darwin --bundles dmg
      - mkdir -p release
      - cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg release/MilkTea-macos-aarch64.dmg
      - cp src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg release/MilkTea-macos-x86_64.dmg
      - cd release && shasum -a 256 MilkTea-macos-aarch64.dmg > MilkTea-macos-aarch64.dmg.sha256
      - cd release && shasum -a 256 MilkTea-macos-x86_64.dmg > MilkTea-macos-x86_64.dmg.sha256

  - name: upload-macos
    image: bash
    depends_on: [build-macos]
    environment:
      GH_TOKEN:
        from_secret: github_release_token
    commands:
      - >-
        gh release upload "$CI_COMMIT_TAG"
        release/MilkTea-macos-aarch64.dmg
        release/MilkTea-macos-aarch64.dmg.sha256
        release/MilkTea-macos-x86_64.dmg
        release/MilkTea-macos-x86_64.dmg.sha256
        --clobber --repo "$CI_REPO"
