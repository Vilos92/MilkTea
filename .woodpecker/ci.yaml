# Runs fmt, lint, typecheck, unit tests, and Storybook browser tests on every
# push to main and every pull request. On pull requests, also runs a fallow
# audit diffing against the merge base. The jobs are independent so a slow one
# never gates the rest.
#
# Step images build locally on the CI host under greg-zone/ci/, never pushed:
# greg-zone/bun-git (oven/bun plus git) for most JS steps, and
# greg-zone/milktea-storybook (bun-git with Chromium prebaked) for the browser
# tests, so no step downloads a browser at run time. If every step fails pulling
# an image, rebuild it there.
when:
  - event: pull_request
  - event: push
    branch: main

clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      # fallow diffs against a merge base, which a partial clone lacks.
      partial: false

steps:
  - name: install
    image: greg-zone/bun-git:1.4.0
    commands:
      - bun install --frozen-lockfile

  - name: fmt
    image: greg-zone/bun-git:1.4.0
    depends_on: [install]
    commands:
      - bun run fmt:check

  - name: comment-fmt
    image: greg-zone/bun-git:1.4.0
    depends_on: [install]
    commands:
      - bun run comment-fmt:check

  - name: lint
    image: greg-zone/bun-git:1.4.0
    depends_on: [install]
    commands:
      - bun run lint

  - name: typecheck
    image: greg-zone/bun-git:1.4.0
    depends_on: [install]
    commands:
      - bun run typecheck

  - name: test-unit
    image: greg-zone/bun-git:1.4.0
    depends_on: [install]
    commands:
      - bun run test:unit

  # milktea-storybook is bun-git with Chromium prebaked at PLAYWRIGHT_BROWSERS_PATH,
  # so this step no longer downloads the browser on every run.
  - name: test-storybook
    image: greg-zone/milktea-storybook:1.4.0-pw1.58.2
    depends_on: [install]
    commands:
      - bun run test:storybook

  - name: fallow
    image: greg-zone/bun-git:1.4.0
    depends_on: [install]
    when:
      - event: pull_request
    commands:
      - bun run fallow:audit -- --base 'HEAD^1'
