# Runs fmt, lint, typecheck, unit tests, Storybook browser tests, and Rust
# checks on every push to main and every pull request. On pull requests, also
# runs a fallow audit diffing against the merge base. The jobs are independent
# so a slow one never gates the rest, and no step downloads a browser at run
# time.
#
# Step images build locally on the CI host under greg-zone/ci/, never pushed:
# greg-zone/bun-git (oven/bun plus git) for most JS steps, greg-zone/milktea-rust
# (rust 1.95.0 with rustfmt, clippy, and the Tauri Linux libraries) for the Rust
# steps, and greg-zone/milktea-storybook (bun-git with Chromium prebaked) for the
# browser tests. If every step fails pulling an image, rebuild it there.
when:
  - event: pull_request
  - event: push
    branch: main

clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      # fallow diffs against a merge base, which a partial clone lacks.
      partial: false

steps:
  - name: install
    image: greg-zone/bun-git:1.4.0
    commands:
      - bun install --frozen-lockfile

  - name: fmt
    image: greg-zone/bun-git:1.4.0
    depends_on: [install]
    commands:
      - bun run fmt:check

  - name: comment-fmt
    image: greg-zone/bun-git:1.4.0
    depends_on: [install]
    commands:
      - bun run comment-fmt:check

  - name: lint
    image: greg-zone/bun-git:1.4.0
    depends_on: [install]
    commands:
      - bun run lint

  - name: typecheck
    image: greg-zone/bun-git:1.4.0
    depends_on: [install]
    commands:
      - bun run typecheck

  - name: test-unit
    image: greg-zone/bun-git:1.4.0
    depends_on: [install]
    commands:
      - bun run test:unit

  # milktea-storybook is bun-git with Chromium prebaked at PLAYWRIGHT_BROWSERS_PATH,
  # so this step no longer downloads the browser on every run.
  - name: test-storybook
    image: greg-zone/milktea-storybook:1.4.0-pw1.58.2
    depends_on: [install]
    commands:
      - bun run test:storybook

  - name: fallow
    image: greg-zone/bun-git:1.4.0
    depends_on: [install]
    when:
      - event: pull_request
    commands:
      - bun run fallow:audit -- --base 'HEAD^1'

  # The Rust checks run cargo directly in the rust image, since the bun scripts
  # are thin wrappers and this image has no bun. They need no dependencies, so
  # they start immediately alongside the JS steps.
  - name: rust-fmt
    image: greg-zone/milktea-rust:1.95.0
    depends_on: []
    commands:
      # same command as `bun run fmt:rust:check`
      - cargo fmt --manifest-path src-tauri/Cargo.toml --check

  - name: rust-clippy
    image: greg-zone/milktea-rust:1.95.0
    depends_on: []
    commands:
      # same command as `bun run lint:rust`
      - cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
