<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>MilkTea</title>
    <meta name="description" content="MilkTea — visual music in the browser." />
    <meta name="theme-color" data-theme-color content="#fff" />
    <script>
      (() => {
        let theme;
        try {
          const storedTheme = JSON.parse(localStorage.getItem('milktea:theme'));
          if (storedTheme === 'light' || storedTheme === 'dark') {
            theme = storedTheme;
            document.documentElement.dataset.theme = theme;
          }
        } catch {
          // Storage can be unavailable or contain malformed JSON.
        }

        const resolvedTheme =
          theme ?? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.querySelector('meta[data-theme-color]').content = resolvedTheme === 'dark' ? '#000' : '#fff';
      })();
    </script>

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <meta property="og:title" content="MilkTea" />
    <meta property="og:description" content="MilkTea — visual music in the browser." />
    <meta property="og:image" content="https://milktea.ink/pwa-512x512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:url" content="https://milktea.ink" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MilkTea" />
    <meta name="twitter:description" content="MilkTea — visual music in the browser." />
    <meta name="twitter:image" content="https://milktea.ink/pwa-512x512.png" />

    <style>
      html {
        background: light-dark(#fff, #000);
        color-scheme: light dark;
      }

      html[data-theme='light'] {
        color-scheme: light;
      }

      html[data-theme='dark'] {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      }

      #app {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: light-dark(#fff, #000);
      }

      #app .splash-placeholder {
        width: 280px;
        height: 96px;
      }
    </style>
  </head>
  <body>
    <div id="app"><div class="splash-placeholder" aria-hidden="true"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
